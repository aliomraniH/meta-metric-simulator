  description: |
    Ranking signal weights consumed by algorithms/ranking.py.  Three of the
    weights — alpha_watch_time, beta_like_rate_connected, and
    gamma_send_rate_unconnected — anchor on Mosseri's verbatim Jan 22 2025
    statement (the "top three signals" quote in §10 of the reference doc)
    and carry public_statement / high provenance.  Everything else is a
    synthesized seed default and is calibration-tuned in M11.

# ---------------------------------------------------------------------------
# Mosseri-anchored weights (§10.1; Mosseri Jan 22 2025 verbatim)
# ---------------------------------------------------------------------------

alpha_watch_time:
  value: 0.40
  source: "reels_metrics_comprehensive_v2.md §10.1"
  provenance: "public_statement"
  confidence: "high"
  note: "Mosseri Jan 22 2025: 'The top three signals that matter most for ranking are watch time, likes and sends.' watch_time is the #1 signal."

beta_like_rate_connected:
  value: 0.20
  source: "reels_metrics_comprehensive_v2.md §10.1"
  provenance: "public_statement"
  confidence: "high"
  note: "Mosseri Jan 22 2025: 'Likes are slightly more important for connected content.' Weighted lower than watch_time and send_rate per Mosseri's framing."

gamma_send_rate_unconnected:
  value: 0.30
  source: "reels_metrics_comprehensive_v2.md §10.1"
  provenance: "public_statement"
  confidence: "high"
  note: "Mosseri Jan 22 2025: 'Sends are slightly more important for unconnected content.' Sends weighted ~3-5× likes per §4.4 send-to-like derivation."

