_meta:
  owner: "algorithm_authors"
  refresh_cadence_days: 30
  last_updated: "2026-04-28"
  layer: 3
  description: |
    Monetization parameters consumed by algorithms/monetization.py.  eCPM
    distribution is derived from §4.2 of the reference doc (Reels Tier-1
    $10-23, Tier-2 $1-5, Meta blended $6.59).  The Reels-vs-Feed
    efficiency ratio is flag:not_disclosed per §4.2.  The 55% in-stream
    creator revshare is widely cited but not Meta-documented (§4.3).
    ad_load_to_skip_elasticity and conversion_lift_propagation are
    synthesized seeds tuned by calibration test_02 and test_04 in M11.

# ---------------------------------------------------------------------------
# Skip-rate response to ad load (calibration test_02 tunes)
# ---------------------------------------------------------------------------

ad_load_to_skip_elasticity:
  value: 0.40
  source: "reels_metrics_comprehensive_v2.md §11.2"
  provenance: "synthesized_2026-04-28"
  confidence: "low"
  note: "Synthesized seed; calibration test_02 tunes against Sensor Tower 35→53% ad-share ramp with expected skip-rate Δ ∈ [+12%, +20%]. Meta does not publish this elasticity."

# ---------------------------------------------------------------------------
# eCPM distribution — sampled by monetization.maybe_ad
# Derived from §4.2: Reels Tier-1 $10-$23 (US/UK/AU; finance/SaaS $20+),
# Reels Tier-2 $1-$5 (LatAm/India/SEA), Meta blended $6.59 (Oct 2025).
# ---------------------------------------------------------------------------

ecpm_distribution:
  mean:
    value: 8.0
    source: "reels_metrics_comprehensive_v2.md §4.2"
    provenance: "synthesized_2026-04-28"
    confidence: "low"
    note: "Volume-weighted blend of Tier-1 (~$16 mid) and Tier-2 (~$3 mid) anchored at Meta blended $6.59. Meta does not publish a Reels-specific eCPM distribution."
  sd:
    value: 4.0
    source: "reels_metrics_comprehensive_v2.md §4.2"
    provenance: "synthesized_2026-04-28"
    confidence: "low"
    note: "Spread chosen so 95% of samples fall within Tier-1 / Tier-2 envelope before clamping."
  floor:
    value: 0.5
    source: "reels_metrics_comprehensive_v2.md §4.2"
    provenance: "synthesized_2026-04-28"
    confidence: "low"
    note: "Floor below Tier-2 lower bound ($1) to admit a thin long tail of low-monetization geos."
  ceiling:
    value: 25.0
    source: "reels_metrics_comprehensive_v2.md §4.2"
    provenance: "synthesized_2026-04-28"
    confidence: "low"
    note: "Above Tier-1 upper bound ($23) to admit finance/SaaS premium ($20+ per Adamigo 2026)."

