[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reels-sim-mcp"
version = "0.1.0"
description = "Reels AT Simulator — hybrid Claude Agent SDK + MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Reels Sim Team" }]

dependencies = [
    "claude-agent-sdk>=0.16",
    "fastmcp>=3.0",
    "anthropic>=0.40",
    "voyageai>=0.3",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "pyyaml>=6.0",
    "ulid-py>=1.1",
    "aiofiles>=23.0",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp>=1.24",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "infra*",
    "orchestrator*",
    "substrate*",
    "algorithms*",
    "params*",
    "baselines*",
    "curation*",
    "engine*",
    "metrics*",
    "insights*",
    "calibration*",
    "interview*",
    "tools*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
