  what_happened: |
    Algorithmic failure surfaced graphic violent and (in some cases)
    sexual content in Reels feeds, including for users with Sensitive
    Content Control on highest setting.  Occurred ~1 month after Meta's
    Jan 2025 announcement to (a) end third-party fact-checking in favor
    of Community Notes, (b) scale back automated moderation to extreme
    violations only.
