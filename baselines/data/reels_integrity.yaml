    "We have fixed an error that caused some users to see content in their Instagram Reels feed that should not have been recommended. We apologize for the mistake."
  apology_speaker: "Meta spokesperson"
  apology_event: "Meta apology, February 27 2025"
  cataloged_as: "OECD AI Incident #957"
  aftermath_note: |
    CBS News April 2025 follow-up identified 600+ accounts pushing
    graphic violence still active with $1K+/day economics.  No public
    root-cause technical explanation from Meta.
  calibration_use: |
    Spike violating_prevalence for 48 hours, expect circuit-breaker
    fires within 24h, brief watch-time spike (freeze-in-horror), recovery
    within 14 days.  Per §0 item 9, do NOT use a specific peak
    prevalence number — Meta never published one.  The spike multiplier
    seed (5x baseline) lives in params/integrity_dynamics.yaml as
    feb_2025_incident_replay_factor.
  no_published_peak:
