_meta:
  owner: "external_facts"
  refresh_cadence_days: 90
  last_updated: "2026-04-28"
  layer: 4
  description: |
    Reels engagement micro-metrics from §4.4 (industry-aggregator
    estimates) and §4.5 (Aug 2025 Skip Rate metric).  Per §0 item 10,
    Meta does NOT publish per-Reels engagement metrics — skip rate,
    completion rate, send rate, save rate at the platform level are
    industry estimates only.  Every numeric value in this file
    therefore carries confidence "low" (or "medium" only for the
    Mosseri-derived send-to-like weighting).  These values are NOT
    calibration anchors; they are seed inputs for
    params/segment_propensities.yaml and reference data for the
    interview question gen.

