    View-definition asymmetry baseline from §6 of
    reels_metrics_comprehensive_v2.md.  THIS FILE IS MANDATORY
    INJECTION CONTENT — the M18 MCP tool wrapper
    tools/baseline_tools.py get_competitor_comparison MUST inject
