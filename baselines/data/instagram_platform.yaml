_meta:
  owner: "external_facts"
  refresh_cadence_days: 90
  last_updated: "2026-04-28"
  layer: 4
  description: |
    Instagram platform baselines from §3 of reels_metrics_comprehensive_v2.md.
    User-base figures are public_statement / high (Mosseri / Zuckerberg
    announcements).  DAU/MAU ratio is derived from Zuckerberg's
    qualitative "just shy of 2 billion" — Meta does not officially
    disclose DAU.  Time-spent and ad-revenue figures are eMarketer /
    industry analyst with medium confidence.  Top-region user counts
    use DataReportal as the primary baseline; the 472-480M Backlinko /
    Sprout Social India figure is recorded only as a methodology note
    (alternative aggregators differ).

